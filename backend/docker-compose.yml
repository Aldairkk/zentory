version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zentory-backend
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: sqlite:///./zentory.db
      SECRET_KEY: abc
      ADMIN_EMAIL: admin@zentory.com
      ADMIN_PASSWORD: Admin123!
    volumes:
      - .:/app
      - ../index.html:/app/index.html
    working_dir: /app
    restart: unless-stopped